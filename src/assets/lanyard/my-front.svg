  <rect x="40" y="340" width="60" height="3" fill="#94a3b8" />
  <rect x="40" y="360" width="15" height="12" fill="#4f46e5" />

  <!-- Photo Frame / Placeholder -->
  <g transform="translate(260, 290)">
    <rect x="-5" y="-5" width="290" height="370" fill="none" stroke="#c7d2fe" stroke-width="2" />
    <image href="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=400&amp;q=80" x="0" y="0" width="280" height="360" preserveAspectRatio="xMidYMid slice" filter="grayscale(100%)" />
    <!-- Photo glitch artifacts -->
    <rect x="250" y="30" width="30" height="15" fill="#ffffff" />
    <rect x="-10" y="100" width="20" height="10" fill="#4f46e5" />
    <rect x="260" y="250" width="20" height="40" fill="#ffffff" />
  </g>

